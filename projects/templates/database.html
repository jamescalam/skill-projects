<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<!-- The Projects skill's database page: the project's home. Keep the spacesheep:records meta on every publish: a
     publish without it sends the collections back to private, and every board loses them. It reads its own records
     (api/records/…), and its boards from the settings record, so it is published once, complete. -->
<meta name="spacesheep:records" content='{"tasks":{"mode":"shared","edit":"any"},"labels":{"mode":"shared","edit":"any"},"settings":{"mode":"shared","edit":"any"},"archive":{"mode":"shared","edit":"author"}}'>
<style>
:root{--ground:#fbfbfa;--ink:#1b1b1d;--surface:#fff;--accent:#4f46e5;--muted:#5f6068;--rule:#e6e6e3;--radius:6px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--font)}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
.product{font-size:14px;color:var(--muted);margin:0}
h1{font-size:24px;line-height:1.25;font-weight:600;margin:4px 0 20px}
h2{font-size:14px;font-weight:600;color:var(--muted);margin:24px 0 8px}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.boards a{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;color:var(--ink);text-decoration:none;font-weight:600;min-height:44px}
.boards a:hover,.boards a:focus-visible{border-color:var(--accent);outline:none}
.boards a span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--rule)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
ol.recent{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.recent li{display:flex;gap:12px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--rule);font-size:15px}
ol.recent .k{color:var(--muted);font-size:13px;min-width:56px}
ol.recent .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.recent .s{color:var(--muted);font-size:13px;white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <p class="product">Projects · {{KEY}}</p>
  <h1>{{NAME}}</h1>
  <h2>Boards</h2>
  <nav class="boards" id="boards" aria-label="Boards"><p class="empty">Loading…</p></nav>
  <h2>Where things stand</h2>
  <div id="sum"><p class="empty">Loading…</p></div>
  <h2>Last changed</h2>
  <div id="recent"></div>
</main>
<script>
(function () {
  "use strict";
  var STATES = [["backlog", "Backlog", "#c8c8c4"], ["todo", "Todo", "#8b8d98"], ["in_progress", "In progress", "#4f46e5"], ["in_review", "In review", "#b45309"], ["done", "Done", "#15803d"]];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function get(c, cursor, had) { return fetch("api/records/" + c + "?limit=500" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""), { credentials: "include" }).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (j) { var all = (had || []).concat(j.records || []); return j.next_cursor ? get(c, j.next_cursor, all) : { records: all }; }); }
  function drawBoards(set) {
    var b = set && Array.isArray(set.boards) ? set.boards : [];
    $("boards").innerHTML = b.length ? b.map(function (x) { return /^https:\/\//.test(String(x.url)) || /^http:\/\/localhost/.test(String(x.url)) ? '<a href="' + esc(x.url) + '">' + esc(x.name) + "</a>" : ""; }).join("") : '<p class="empty">No boards yet.</p>';
  }
  function draw(tasks, archived) {
    var parents = {}, live = (tasks.forEach(function (t) { if (t.data.parent) parents[t.data.parent] = 1; }), tasks.filter(function (t) { return t.data.state !== "dropped" && !parents[t.data.key]; })), n = live.length;
    var count = {}; live.forEach(function (t) { var s = t.data.state || "backlog"; count[s] = (count[s] || 0) + 1; });
    $("sum").innerHTML = n ? '<div class="bar" role="img" aria-label="' + STATES.map(function (s) { return (count[s[0]] || 0) + " " + s[1]; }).join(", ") + '">' +
      STATES.map(function (s) { return count[s[0]] ? '<i style="width:' + (100 * count[s[0]] / n) + "%;background:" + s[2] + '"></i>' : ""; }).join("") + "</div>" +
      '<ul class="legend">' + STATES.map(function (s) { return '<li><i style="background:' + s[2] + '"></i>' + esc(s[1]) + " <b>" + (count[s[0]] || 0) + "</b></li>"; }).join("") + (archived ? "<li>Archived <b>" + archived + "</b></li>" : "") + "</ul>"
      : '<p class="empty">No tasks yet. Open a board and press N.</p>';
    var label = {}; STATES.forEach(function (s) { label[s[0]] = s[1]; });
    var recent = tasks.slice().sort(function (a, b) { return String(b.updated_at || "") < String(a.updated_at || "") ? -1 : 1; }).slice(0, 8);
    $("recent").innerHTML = recent.length ? '<ol class="recent">' + recent.map(function (t) {
      return '<li><span class="k">' + esc(t.data.key || "") + '</span><span class="t">' + esc(t.data.title || "Untitled") + '</span><span class="s">' + esc(label[t.data.state] || "Dropped") + "</span></li>";
    }).join("") + "</ol>" : "";
  }
  var busy = false, again = false;
  function load() {
    if (busy) { again = true; return; }
    busy = true;
    Promise.all([get("tasks"), get("settings").catch(function () { return { records: [] }; }), get("archive").catch(function () { return { records: [] }; })]).then(function (got) {
      draw(got[0].records || [], (got[2].records || []).length); drawBoards(((got[1].records || [])[0] || {}).data);
    }, function () {
      if (!$("sum").querySelector(".bar")) $("sum").innerHTML = '<p class="empty">The tasks didn\u2019t load. Reload to try again.</p>';
    }).then(function () { busy = false; if (again) { again = false; load(); } });
  }
  document.addEventListener("ss:records", function () { load(); });
  load();
})();
</script>
</body>
</html>
