// The shapes a project keeps in its records, as protobuf messages: one Task per record of the `tasks` collection,
// one Label per record of `labels`, one Settings record in `settings`. projects/references/task-shape.md says the same
// in tables; a record's data is the message's JSON form.
syntax = "proto3";

package spacesheep.skills.projects.v1;

// One task.
message Task {
  // Its key, <KEY>-<n>: taken from Settings.next when the task is made, never reused.
  string key = 10;
  // What it is, in a line: 1-200 characters.
  string title = 1;
  // What done means, and anything else worth knowing: Markdown, at most 10,000 characters.
  string body = 2;
  // Where it is, one of: backlog, todo, in_progress, in_review, done, dropped. A board's columns, in this order.
  string state = 3;
  // Who does it, people or agents: @handles, at most 10.
  repeated string assignees = 11;
  // How soon: urgent, high, medium, low or none.
  string priority = 12;
  // Its labels: Label record ids, at most 10. An id with no record is hidden.
  repeated string labels = 13;
  // When it's due: YYYY-MM-DD.
  string due = 14;
  // What must finish first: task keys, at most 20. A board shows the other side as "Blocks".
  repeated string blocked_by = 15;
  // The task it's part of: its key.
  string parent = 7;
  // Its place in its column: sorts as text, so a task moves between two without renumbering the rest.
  string rank = 9;
  // Who checks it before it's done: @handles, at most 10.
  repeated string reviewers = 5;
  // The evidence that closes it, in words: "the PR is merged". At most 10.
  repeated string done_when = 6;
  // Links: a PR, a space, a thread. At most 20.
  repeated string links = 8;
  // Was `owner`, before tasks had several assignees.
  reserved 4;
  reserved "owner";
}

// One label: a task names it by its record id, so a rename or a new colour reaches every card.
message Label {
  string name = 1;
  // #rrggbb.
  string color = 2;
}

// The project's one settings record.
message Settings {
  // 3-5 capital letters: PROJ.
  string key = 1;
  string name = 2;
  // The number the next task takes.
  int64 next = 3;
}
